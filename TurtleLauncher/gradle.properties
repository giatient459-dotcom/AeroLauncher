# launcher_name is an internal identifier: it names the on-disk data directory
# (games/TurtleLauncher), the launcher log tag, the version-JSON launcher_name
# field and the touch-controller socket. It must stay "TurtleLauncher" so that
# existing installations keep finding their game profiles and so the native
# side keeps matching. Only launcher_app_name is the user-facing brand.
launcher_name=TurtleLauncher
launcher_app_name=AeroLauncher

launcher_version_code=400000
launcher_version_name=4
