<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480" role="img" aria-labelledby="title desc">
  <title id="title">AeroLauncher — Minecraft Java Edition for Android</title>
  <desc id="desc">A futuristic navy and cyan AeroLauncher brand splash with an orbital A emblem and Minecraft-inspired pixel blocks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B18"/>
      <stop offset=".55" stop-color="#0A1B33"/>
      <stop offset="1" stop-color="#0B3A66"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DEBFF"/>
      <stop offset=".48" stop-color="#00B8D9"/>
      <stop offset="1" stop-color="#168BFF"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1F3A" stop-opacity=".1"/>
      <stop offset="1" stop-color="#00B8D9" stop-opacity=".16"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7DEBFF" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1400" height="480" rx="26" fill="url(#bg)"/>
  <rect width="1400" height="480" rx="26" fill="url(#grid)"/>
  <path d="M0 390 290 280 480 480H0Z" fill="#168BFF" opacity=".06"/>
  <path d="M1400 0 1110 0 1400 210Z" fill="#00B8D9" opacity=".08"/>
  <g opacity=".65" fill="#7DEBFF">
    <circle cx="90" cy="90" r="2"/><circle cx="320" cy="62" r="2"/><circle cx="540" cy="112" r="2"/>
    <circle cx="1280" cy="86" r="2"/><circle cx="1190" cy="372" r="2"/><circle cx="1020" cy="410" r="2"/>
    <circle cx="720" cy="54" r="1.5"/><circle cx="840" cy="430" r="1.5"/>
  </g>
  <g transform="translate(245 240)">
    <circle r="112" fill="#061426" stroke="#168BFF" stroke-opacity=".35" stroke-width="2"/>
    <ellipse rx="136" ry="53" transform="rotate(-28)" fill="none" stroke="url(#cyan)" stroke-width="4" filter="url(#glow)"/>
    <path d="M-58 58 0-72 61 58H31L0-10-30 58Z" fill="url(#cyan)" filter="url(#glow)"/>
    <path d="M-25 27H26L37 48H-36Z" fill="#061426"/>
    <circle cx="103" cy="-50" r="8" fill="#7DEBFF" filter="url(#glow)"/>
    <path d="M-88-80l14-14m-4 20 14-14M75 86l14-14m-4 20 14-14" stroke="#7DEBFF" stroke-width="3" stroke-linecap="round" opacity=".75"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="455" y="208" fill="#FFFFFF" font-size="74" font-weight="800" letter-spacing="2">AERO<tspan fill="url(#cyan)">LAUNCHER</tspan></text>
    <path d="M460 230H1125" stroke="url(#cyan)" stroke-width="3" stroke-linecap="round"/>
    <text x="462" y="274" fill="#C9F6FF" font-size="24" font-weight="600" letter-spacing="4">MINECRAFT: JAVA EDITION</text>
    <text x="462" y="312" fill="#91AFC9" font-size="20" letter-spacing="2">ANDROID  •  OPEN SOURCE  •  YOUR WORLD</text>
  </g>
  <g transform="translate(1110 350)" opacity=".9">
    <path d="M0 0h36v36H0z" fill="#168BFF" opacity=".75"/>
    <path d="M36-36h36V0H36z" fill="#00B8D9" opacity=".85"/>
    <path d="M72 0h36v36H72z" fill="#7DEBFF" opacity=".7"/>
    <path d="M36 36h36v36H36z" fill="#0B3A66" stroke="#00B8D9" stroke-opacity=".65"/>
    <path d="M-36 36H0v36h-36z" fill="#0B3A66" stroke="#168BFF" stroke-opacity=".65"/>
  </g>
  <path d="M42 438H1358" stroke="#7DEBFF" stroke-opacity=".25"/>
  <text x="48" y="462" fill="#7F9BB8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="2">A COMMUNITY-DRIVEN ANDROID LAUNCHER</text>
</svg>