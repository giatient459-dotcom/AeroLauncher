<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">AeroLauncher logo</title>
  <desc id="desc">A stylized white and cyan letter A with a blue orbital swoosh on a midnight navy background.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D1FF"/>
      <stop offset="1" stop-color="#0066FF"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B8E9FF"/>
    </linearGradient>
    <radialGradient id="bg">
      <stop offset="0" stop-color="#0C2345"/>
      <stop offset="1" stop-color="#080F20"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="210" fill="url(#bg)"/>
  <circle cx="512" cy="480" r="355" fill="none" stroke="#12396B" stroke-width="2" opacity=".45"/>
  <path d="M225 742 482 215 568 215 811 742 652 742 522 454 389 742Z" fill="url(#blue)"/>
  <path d="M482 215 568 215 652 402 559 354 510 354 412 546 337 604Z" fill="url(#white)"/>
  <path d="M191 542 C326 512 474 424 632 340 C720 294 788 302 812 345 C842 397 759 453 690 477 C526 535 356 582 223 601 C358 565 510 504 631 438 C690 406 724 373 707 360 C686 343 636 370 596 393 C446 479 300 548 191 542Z" fill="url(#blue)" filter="url(#glow)"/>
  <path d="M512 757 535 801 580 824 535 847 512 892 489 847 444 824 489 801Z" fill="#00D1FF"/>
  <text x="512" y="950" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="700" fill="#F4F7FF">Aero<tspan fill="#00D1FF">Launcher</tspan></text>
</svg>